name: CI & Packaging

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libasound2-dev
          sudo apt-get install -y libwxgtk3.2-dev || sudo apt-get install -y libwxgtk3.0-gtk3-dev

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Build Jazz++
        run: |
          cmake --build build --parallel $(nproc)

      - name: Verify Binary
        run: |
          file build/jazz
          ls -lh build/jazz
          ldd build/jazz

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jazz-bin-${{ matrix.os }}
          path: build/jazz
          if-no-files-found: error

  appimage:
    name: Package AppImage (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libasound2-dev file wget
          sudo apt-get install -y libwxgtk3.2-dev || sudo apt-get install -y libwxgtk3.0-gtk3-dev

      - name: Build Project
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel $(nproc)

      - name: Download AppImage Tool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool

      - name: Build AppDir and AppImage
        run: |
          ./scripts/build-appimage.sh build
          ./appimagetool --appimage-extract-and-run AppDir Jazz++-x86_64.AppImage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jazz++-x86_64.AppImage
          path: Jazz++-x86_64.AppImage
          if-no-files-found: error

  build-windows:
    name: Build & Package Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache wxWidgets
        id: cache-wxwidgets
        uses: actions/cache@v4
        with:
          path: C:\wxWidgets
          key: wxwidgets-3.2.6-vc14x-x64

      - name: Download and Install wxWidgets
        if: steps.cache-wxwidgets.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\wxWidgets
          curl.exe -L -s -S "https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.6/wxWidgets-3.2.6-Headers.7z" -o wxHeaders.7z
          curl.exe -L -s -S "https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.6/wxMSW-3.2.6_vc14x_x64_Dev.7z" -o wxDev.7z
          curl.exe -L -s -S "https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.6/wxMSW-3.2.6_vc14x_x64_ReleaseDLL.7z" -o wxDLL.7z
          7z x wxHeaders.7z -oC:\wxWidgets -y
          7z x wxDev.7z -oC:\wxWidgets -y
          7z x wxDLL.7z -oC:\wxWidgets -y

      - name: Inspect wxWidgets Directory
        shell: pwsh
        run: |
          Get-ChildItem C:\wxWidgets
          if (Test-Path C:\wxWidgets\lib) { Get-ChildItem C:\wxWidgets\lib }
          if (Test-Path C:\wxWidgets\lib\vc14x_x64_dll) { Get-ChildItem C:\wxWidgets\lib\vc14x_x64_dll }

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DwxWidgets_EXCLUDE_COMMON_LIBRARIES=ON `
            -DwxWidgets_ROOT_DIR="C:/wxWidgets" `
            -DwxWidgets_LIB_DIR="C:/wxWidgets/lib/vc14x_x64_dll" `
            -DwxWidgets_CONFIGURATION=mswu

      - name: Build Jazz++
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Package Windows Release
        shell: pwsh
        run: |
          cmake --install build --prefix dist --config Release
          Copy-Item "C:\wxWidgets\lib\vc14x_x64_dll\*.dll" -Destination dist\
          Copy-Item "LICENSE" -Destination dist\
          Copy-Item "README.md" -Destination dist\
          Compress-Archive -Path dist\* -DestinationPath jazz-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jazz-windows-x64.zip
          path: jazz-windows-x64.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, appimage, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: Jazz++-x86_64.AppImage

      - name: Download Windows Zip
        uses: actions/download-artifact@v4
        with:
          name: jazz-windows-x64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Jazz++-x86_64.AppImage
            jazz-windows-x64.zip
          generate_release_notes: true
