name: CI & Packaging

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build-linux:
    name: Build Linux (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libasound2-dev libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev
          sudo apt-get install -y libwxgtk3.2-dev || sudo apt-get install -y libwxgtk3.0-gtk3-dev

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_JAZZ_JUCE=ON \
            -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Build Jazz++ & JUCE 8
        run: |
          cmake --build build --parallel $(nproc)

      - name: Run Unit Tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Verify Binaries
        run: |
          file build/jazz
          ls -lh build/jazz
          if [ -f "build/jazz-juce" ]; then
            file build/jazz-juce
            ls -lh build/jazz-juce
          fi

      - name: Upload Linux Binaries
        uses: actions/upload-artifact@v4
        with:
          name: jazz-linux-${{ matrix.os }}
          path: |
            build/jazz
            build/jazz-juce
          if-no-files-found: error
          overwrite: true

  appimage:
    name: Package AppImage (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libasound2-dev file wget libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev
          sudo apt-get install -y libwxgtk3.2-dev || sudo apt-get install -y libwxgtk3.0-gtk3-dev

      - name: Build Project
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_JAZZ_JUCE=ON
          cmake --build build --parallel $(nproc)
          ctest --test-dir build --output-on-failure

      - name: Download AppImage Tool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool

      - name: Build AppDir and AppImage
        run: |
          ./scripts/build-appimage.sh build
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir Jazz++-x86_64.AppImage
          ls -lh Jazz++-x86_64.AppImage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jazz++-x86_64.AppImage
          path: Jazz++-x86_64.AppImage
          if-no-files-found: error
          overwrite: true

  build-windows:
    name: Build Windows (MSVC x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache wxWidgets
        id: cache-wx
        uses: actions/cache@v4
        with:
          path: D:/wxWidgets
          key: wxwidgets-3.2.6-msvc-x64-v3

      - name: Download & Extract wxWidgets 3.2.6
        if: steps.cache-wx.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "D:\wxWidgets"
          Invoke-WebRequest -Uri "https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.6/wxWidgets-3.2.6-headers.7z" -OutFile "wx_headers.7z"
          Invoke-WebRequest -Uri "https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.6/wxMSW-3.2.6_vc14x_x64_Dev.7z" -OutFile "wx_dev.7z"
          Invoke-WebRequest -Uri "https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.6/wxMSW-3.2.6_vc14x_x64_ReleaseDLL.7z" -OutFile "wx_dll.7z"
          7z x wx_headers.7z -o"D:\wxWidgets" -y
          7z x wx_dev.7z -o"D:\wxWidgets" -y
          7z x wx_dll.7z -o"D:\wxWidgets" -y
          Remove-Item wx_headers.7z, wx_dev.7z, wx_dll.7z

      - name: Configure CMake
        shell: pwsh
        env:
          WXWIN: "D:/wxWidgets"
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_JAZZ_JUCE=ON `
            -DwxWidgets_ROOT_DIR="D:/wxWidgets" `
            -DwxWidgets_LIB_DIR="D:/wxWidgets/lib/vc14x_x64_dll" `
            -DwxWidgets_CONFIGURATION=mswu

      - name: Build Jazz++ & Tests
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Run Unit Tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows Release (ZIP)
        shell: pwsh
        run: |
          $pkgDir = "Jazz++-Windows-x64"
          New-Item -ItemType Directory -Force -Path $pkgDir

          # Copy classic executable
          if (Test-Path "build\Release\jazz.exe") {
            Copy-Item "build\Release\jazz.exe" "$pkgDir\"
          } elseif (Test-Path "build\jazz.exe") {
            Copy-Item "build\jazz.exe" "$pkgDir\"
          }

          # Copy modern JUCE 8 executable
          if (Test-Path "build\jazz-juce_artefacts\Release\Jazz++ JUCE.exe") {
            Copy-Item "build\jazz-juce_artefacts\Release\Jazz++ JUCE.exe" "$pkgDir\jazz-juce.exe"
          } elseif (Test-Path "build\Release\jazz-juce.exe") {
            Copy-Item "build\Release\jazz-juce.exe" "$pkgDir\"
          }

          # Copy wxWidgets runtime DLLs
          Copy-Item "D:\wxWidgets\lib\vc14x_x64_dll\*.dll" "$pkgDir\" -Force

          # Copy assets and documentation
          Copy-Item -Recurse "conf" "$pkgDir\conf"
          Copy-Item "conf\jazz.cfg" "$pkgDir\" -Force
          Copy-Item -Recurse "song" "$pkgDir\song"
          Copy-Item -Recurse "src\HelpFiles" "$pkgDir\HelpFiles"
          Copy-Item "README.md", "COPYING", "ChangeLog" "$pkgDir\"

          # Compress to zip
          Compress-Archive -Path $pkgDir -DestinationPath "Jazz++-Windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jazz++-Windows-x64
          path: Jazz++-Windows-x64.zip
          if-no-files-found: error
          overwrite: true

  build-macos:
    name: Build macOS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-13]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_JAZZ_JUCE=ON \
            -DBUILD_JAZZ_WX=OFF

      - name: Build Jazz++ JUCE & Tests
        run: |
          cmake --build build --parallel

      - name: Run Unit Tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Package macOS Release (ZIP)
        run: |
          mkdir -p "Jazz++-macOS"
          if [ -d "build/jazz-juce_artefacts/Release/Jazz++ JUCE.app" ]; then
            cp -R "build/jazz-juce_artefacts/Release/Jazz++ JUCE.app" "Jazz++-macOS/"
          elif [ -d "build/Jazz++ JUCE.app" ]; then
            cp -R "build/Jazz++ JUCE.app" "Jazz++-macOS/"
          fi
          cp -R conf song src/HelpFiles README.md COPYING "Jazz++-macOS/"
          zip -r "Jazz++-macOS-${{ matrix.os }}.zip" "Jazz++-macOS"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jazz++-macOS-${{ matrix.os }}
          path: Jazz++-macOS-${{ matrix.os }}.zip
          if-no-files-found: error
          overwrite: true

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, appimage, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: Jazz++-x86_64.AppImage

      - name: Download Windows Package
        uses: actions/download-artifact@v4
        with:
          name: Jazz++-Windows-x64

      - name: Download macOS Package (macOS 14 ARM64)
        uses: actions/download-artifact@v4
        with:
          name: Jazz++-macOS-macos-14

      - name: Download macOS Package (macOS 13 x86_64)
        uses: actions/download-artifact@v4
        with:
          name: Jazz++-macOS-macos-13

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Jazz++-x86_64.AppImage
            Jazz++-Windows-x64.zip
            Jazz++-macOS-macos-14.zip
            Jazz++-macOS-macos-13.zip
          generate_release_notes: true
