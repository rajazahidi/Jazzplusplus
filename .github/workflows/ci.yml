name: CI & Packaging

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libasound2-dev
          sudo apt-get install -y libwxgtk3.2-dev || sudo apt-get install -y libwxgtk3.0-gtk3-dev

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Build Jazz++
        run: |
          cmake --build build --parallel $(nproc)

      - name: Verify Binary
        run: |
          file build/jazz
          ls -lh build/jazz
          ldd build/jazz

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jazz-bin-${{ matrix.os }}
          path: build/jazz
          if-no-files-found: error

  appimage:
    name: Package AppImage (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libasound2-dev file wget
          sudo apt-get install -y libwxgtk3.2-dev || sudo apt-get install -y libwxgtk3.0-gtk3-dev

      - name: Build Project
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel $(nproc)

      - name: Download AppImage Tool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool

      - name: Build AppDir and AppImage
        run: |
          ./scripts/build-appimage.sh build
          ./appimagetool --appimage-extract-and-run AppDir Jazz++-x86_64.AppImage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jazz++-x86_64.AppImage
          path: Jazz++-x86_64.AppImage
          if-no-files-found: error

  build-windows:
    name: Build & Package Windows (x64)
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache wxWidgets
        id: cache-wxwidgets
        uses: actions/cache@v4
        with:
          path: C:\wxWidgets
          key: wxwidgets-3.2.6-vc14x-x64

      - name: Download and Install wxWidgets
        if: steps.cache-wxwidgets.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\wxWidgets
          curl.exe -L -s -S "https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.6/wxWidgets-3.2.6-Headers.7z" -o wxHeaders.7z
          curl.exe -L -s -S "https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.6/wxMSW-3.2.6_vc14x_x64_Dev.7z" -o wxDev.7z
          curl.exe -L -s -S "https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.6/wxMSW-3.2.6_vc14x_x64_ReleaseDLL.7z" -o wxDLL.7z
          7z x wxHeaders.7z -oC:\wxWidgets -y
          7z x wxDev.7z -oC:\wxWidgets -y
          7z x wxDLL.7z -oC:\wxWidgets -y

          # Normalize if headers or dev had a top-level wrapper directory
          $wrapper = Get-ChildItem "C:\wxWidgets" -Directory | Where-Object { $_.Name -like "wxWidgets*" }
          if ($wrapper) {
              Copy-Item "$($wrapper.FullName)\*" -Destination "C:\wxWidgets\" -Recurse -Force
          }

      - name: Inspect wxWidgets Directory
        shell: pwsh
        run: |
          Write-Host "=== C:\wxWidgets ==="
          Get-ChildItem C:\wxWidgets
          Write-Host "=== C:\wxWidgets\lib ==="
          if (Test-Path C:\wxWidgets\lib) { Get-ChildItem C:\wxWidgets\lib }
          Write-Host "=== C:\wxWidgets\lib\vc14x_x64_dll ==="
          if (Test-Path C:\wxWidgets\lib\vc14x_x64_dll) { Get-ChildItem C:\wxWidgets\lib\vc14x_x64_dll | Select-Object -First 20 }

      - name: Configure CMake
        shell: pwsh
        run: |
          $out = cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=ON `
            -DwxWidgets_EXCLUDE_COMMON_LIBRARIES=ON `
            -DwxWidgets_ROOT_DIR="C:/wxWidgets" `
            -DwxWidgets_LIB_DIR="C:/wxWidgets/lib/vc14x_x64_dll" `
            -DwxWidgets_CONFIGURATION=mswu 2>&1
          $out | Out-File cmake_output.txt
          $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Jazz++
        shell: pwsh
        run: |
          $build_out = cmake --build build --config Release --parallel 2>&1
          $build_out | Out-File build_output.txt
          $build_out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows Release
        shell: pwsh
        run: |
          & {
            $ErrorActionPreference = 'Stop'

            Write-Host "=== Step 1: Create dist folder ==="
            if (Test-Path "dist") { Remove-Item -Recurse -Force "dist" }
            New-Item -ItemType Directory -Force -Path "dist" | Out-Null

            Write-Host "=== Step 2: Copy jazz.exe ==="
            if (Test-Path "build/Release/jazz.exe") {
                Copy-Item -Path "build/Release/jazz.exe" -Destination "dist/jazz.exe" -Force
                Write-Host "Copied build/Release/jazz.exe"
            } elseif (Test-Path "build/jazz.exe") {
                Copy-Item -Path "build/jazz.exe" -Destination "dist/jazz.exe" -Force
                Write-Host "Copied build/jazz.exe"
            } else {
                throw "jazz.exe was not found in build directory!"
            }

            Write-Host "=== Step 3: Copy conf and song ==="
            Copy-Item -Path "conf" -Destination "dist/conf" -Recurse -Force
            Copy-Item -Path "song" -Destination "dist/song" -Recurse -Force

            Write-Host "=== Step 4: Copy wxWidgets DLLs ==="
            $dllCount = 0
            Get-ChildItem -Path "C:\wxWidgets\lib\vc14x_x64_dll\*.dll" | ForEach-Object {
                if ($_.Name -notlike "*ud_*" -and $_.Name -notlike "*ud.*") {
                    Copy-Item -Path $_.FullName -Destination "dist/$($_.Name)" -Force
                    $dllCount++
                }
            }
            Write-Host "Copied $dllCount wxWidgets runtime DLLs."

            Write-Host "=== Step 5: Copy docs ==="
            Copy-Item -Path "LICENSE" -Destination "dist/LICENSE" -Force
            Copy-Item -Path "README.md" -Destination "dist/README.md" -Force

            Write-Host "=== Step 6: Verify dist contents ==="
            Get-ChildItem -Path "dist" | Format-Table Name, Length

            Write-Host "=== Step 7: Create zip archive ==="
            if (Test-Path "jazz-windows-x64.zip") { Remove-Item -Force "jazz-windows-x64.zip" }
            Compress-Archive -Path "dist\*" -DestinationPath "jazz-windows-x64.zip" -Force
            
            if (-not (Test-Path "jazz-windows-x64.zip")) {
                Write-Host "Compress-Archive did not produce zip, trying 7z..."
                7z a -tzip "jazz-windows-x64.zip" ".\dist\*"
            }

            $zipItem = Get-Item "jazz-windows-x64.zip"
            Write-Host "SUCCESS: jazz-windows-x64.zip created ($($zipItem.Length) bytes)"
          } 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/pkg_output.txt"
          if (-not (Test-Path "jazz-windows-x64.zip")) { exit 1 }

      - name: Post Failure Details to Commit
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $diag = "### Windows Build / Packaging Failure`n`n"
          if (Test-Path "$env:GITHUB_WORKSPACE/pkg_output.txt") {
              $diag += "#### Packaging Output`n````n"
              $diag += (Get-Content "$env:GITHUB_WORKSPACE/pkg_output.txt" -Tail 60 | Out-String)
              $diag += "````n"
          }
          if (Test-Path build_output.txt) {
              $diag += "#### Build Errors`n````n"
              $diag += (Select-String -Path build_output.txt -Pattern "(error|fatal|LNK)" -Context 1,1 | Select-Object -First 30 | Out-String)
              $diag += "````n"
              $diag += "#### Build Output (Tail 50)`n````n"
              $diag += (Get-Content build_output.txt -Tail 50 | Out-String)
              $diag += "````n"
          }
          $json = @{ body = $diag } | ConvertTo-Json
          Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" `
            -Method Post `
            -Headers @{ Authorization = "token $env:GH_TOKEN"; "User-Agent" = "GHA" } `
            -Body $json `
            -ContentType "application/json"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jazz-windows-x64.zip
          path: jazz-windows-x64.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, appimage, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: Jazz++-x86_64.AppImage

      - name: Download Windows Zip
        uses: actions/download-artifact@v4
        with:
          name: jazz-windows-x64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Jazz++-x86_64.AppImage
            jazz-windows-x64.zip
          generate_release_notes: true
